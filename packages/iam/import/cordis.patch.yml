# The bundle layer this package contributes to a profile.
#
# A row names the package (not a relative file) so that Node resolution finds
# the installed copy; the entry resolves the package's `exports["."]`.
#
# No `dsh.client` anywhere in this package, and so no browser half to mount: the
# tools below are host-side, which is what lets this bundle load in the headless
# and sdk profiles that mount no page.
#
# `config:` is optional. Every field has a default and the two environment
# variables beat the first of them, so an empty row is the normal case:
#
#   config:
#     toolsDir: /path/to/build/bin/linux-native
#     timeoutSeconds: 300
#     enableRunInBackground: true
#
- insert:
    - id: iam-import
      name: '@deepseek-ai/iam-import'
