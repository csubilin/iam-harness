<svg width="472" height="40" viewBox="0 0 472 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  /* The ink follows the appearance and the mark does not, which is the same
     split the artwork this replaces made: a brand mark is the one thing on a
     page that says the same thing in either theme, while the words beside it
     are read and have to be legible on whatever the panel happens to be.
     A media query rather than a custom property, because this file is loaded
     through an <img>: properties do not cross that boundary, media queries do. */
  .name { fill: #0f1115; }
  @media (prefers-color-scheme: dark) {
    .name { fill: #f9fafb; }
  }
</style>
<!-- The mark, at the height of the line, from IAM/Assets/mining-platform-icon.svg. -->
<g transform="scale(0.078125)">
  <path fill="#078FCB" fill-rule="evenodd" d="M256 48 454 162v188L256 464 58 350V162L256 48Zm0 65L114 195v122l142 82 142-82V195L256 113Z"/>
  <path fill="#078FCB" d="m256 133 21 61 62 22-62 21-21 62-21-62-62-21 62-22z"/>
  <path d="M119 305c54-25 96-26 137-7s83 19 137-6" fill="none" stroke="#078FCB" stroke-width="19" stroke-linecap="square"/>
  <path d="M214 365v-32a42 42 0 0 1 84 0v32" fill="none" stroke="#078FCB" stroke-width="25" stroke-linecap="square"/>
</g>
<!--
  The name as TEXT rather than as letterform outlines, which is the one real
  difference from the artwork this replaces.  That file was 472x40 of paths
  spelling the old product, because a wordmark drawn by hand has to be; this one
  has four words and can use a font, which is what lets the product be renamed by
  editing a string rather than by redrawing curves.
  The family is the one the welcome page already loads for brand copy
  (apps/desktop/tsdown.config.ts stages Montserrat); the fallbacks are what a
  machine without it draws in the meantime.
-->
<text class="name" x="46" y="27" font-family="Montserrat, system-ui, sans-serif"
      font-size="21" font-weight="600" letter-spacing="0.2">IAM Harness</text>
</svg>
