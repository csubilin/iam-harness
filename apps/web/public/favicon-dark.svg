<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">IAM — insight in the mine</title>
  <desc id="desc">A bold blue geological frame focuses a clean four-point insight spark above a mine tunnel.</desc>
  <path fill="#078FCB" fill-rule="evenodd" d="M256 48 454 162v188L256 464 58 350V162L256 48Zm0 65L114 195v122l142 82 142-82V195L256 113Z"/>
